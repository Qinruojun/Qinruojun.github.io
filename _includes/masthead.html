<a class="skip-link" href="#main">跳到正文</a>
<header class="notes-masthead">
  <div class="notes-masthead-inner">
    <a class="notes-brand" href="{{ '/blog/' | relative_url }}">Ruojun Qin <span>/ 技术笔记</span></a>
    <nav class="notes-nav" aria-label="主导航">
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}{% assign href = link.url %}{% else %}{% assign href = link.url | relative_url %}{% endif %}
        <a href="{{ href }}" {% if page.url contains link.url %}aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
